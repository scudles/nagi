<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：允许本地模型协议与开发期 vite。
       注：script-src 必须留 'unsafe-eval' —— pixi.js v7 用 new Function 生成着色器，
       收紧后 Live2D 模型会加载失败（2026-10-14 实测）。'unsafe-inline' 已移除。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob: nagi-local: http://localhost:* ws://localhost:*; img-src 'self' data: blob: nagi-local:; connect-src 'self' data: blob: nagi-local: http://localhost:* ws://localhost:*; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" />
  <title>凪 Nagi</title>
  <link rel="stylesheet" href="./css/base.css" />
  <!-- Live2D Cubism Core 必须在 pixi-live2d-display 之前加载 -->
  <script src="./vendor/live2dcubismcore.min.js"></script>
</head>
<body data-mode="pet">
  <!-- ============ 桌宠形态 ============ -->
  <div id="pet-root" class="mode-pet">
    <div id="pet-stage">
      <canvas id="live2d-canvas"></canvas>
      <div id="pet-placeholder" class="placeholder">凪</div>
    </div>
    <div id="bubble" class="bubble hidden">
      <div class="bubble-inner"></div>
    </div>
    <div id="pet-status" class="pet-status hidden"></div>
    <div class="pet-toolbar">
      <button id="btn-open-workbench" title="打开工作台">▣</button>
      <button id="btn-pet-settings" title="设置">⚙</button>
      <button id="btn-pet-hide" title="隐藏">✕</button>
    </div>
  </div>

  <!-- ============ 工作台形态 ============ -->
  <div id="workbench-root" class="mode-workbench">
    <header id="titlebar">
      <div class="tb-title">凪 <span class="tb-sub">Nagi · 工作台</span></div>
      <div class="tb-actions">
        <button id="btn-wb-pet" title="回到桌宠">◱</button>
        <button id="btn-wb-min" title="最小化">—</button>
        <button id="btn-wb-close" title="关闭">✕</button>
      </div>
    </header>

    <main id="wb-main">
      <aside id="side-panel">
        <div class="side-head">
          <span id="mood-label">情绪：平静</span>
          <span id="brain-label" class="dim">大脑：占位</span>
        </div>
        <div class="side-note">
          <p class="dim">她的内心独白不实时显示在这里，而是安静地写进日记。</p>
          <button id="btn-open-diary">看看她的日记</button>
        </div>
        <div class="side-foot">
          <button id="btn-open-settings">设置</button>
        </div>
      </aside>

      <section id="chat-panel">
        <div id="messages" class="messages"></div>
        <div id="tool-log" class="tool-log"></div>
        <div id="confirm-bar" class="confirm-bar hidden"></div>
        <div id="composer">
          <textarea id="input" rows="1" placeholder="和凪说点什么…（回车发送，Shift+回车换行）"></textarea>
          <button id="btn-send">发送</button>
        </div>
      </section>
    </main>

    <!-- ============ 设置页 ============ -->
    <div id="settings-overlay" class="overlay hidden">
      <div id="settings-panel">
        <header class="sp-head">
          <span>设置</span>
          <button id="btn-close-settings">✕</button>
        </header>
        <div class="sp-body">
          <h3>大脑（LLM）</h3>
          <label>提供商
            <select id="set-provider"></select>
          </label>
          <label>Base URL <input id="set-baseurl" type="text" /></label>
          <label>模型 <input id="set-model" type="text" /></label>
          <label>Temperature <input id="set-temp" type="number" step="0.1" min="0" max="2" /></label>
          <label>API Key <span id="set-key-status" class="dim">未配置</span>
            <input id="set-apikey" type="password" placeholder="粘贴后点保存" />
          </label>
          <div class="sp-row">
            <button id="btn-save-llm">保存大脑设置</button>
            <button id="btn-save-key">保存 Key</button>
            <button id="btn-del-key" class="danger">删除 Key</button>
          </div>

          <h3>Live2D</h3>
          <label>模型
            <select id="set-model-path"></select>
          </label>
          <label>缩放 <input id="set-l2d-scale" type="number" step="0.05" min="0.3" max="2" /></label>
          <div class="sp-row">
            <button id="btn-refresh-models">刷新模型列表</button>
            <button id="btn-save-l2d">保存 Live2D 设置</button>
          </div>

          <h3>工具与隐私</h3>
          <label>文件工具授权目录 <input id="set-fileroot" type="text" placeholder="留空 = 使用「文档」目录" /></label>
          <label>Chrome 调试端口（CDP） <input id="set-cdp" type="number" /></label>
          <label class="check"><input id="set-confirm" type="checkbox" /> 高危操作需要我确认</label>
          <div class="sp-row">
            <button id="btn-save-tools">保存工具设置</button>
          </div>

          <h3>智能家居（Home Assistant）</h3>
          <label>地址 <input id="set-ha-url" type="text" /></label>
          <label>Token <span id="set-ha-status" class="dim">未配置</span>
            <input id="set-ha-token" type="password" placeholder="Long-Lived Access Token" />
          </label>
          <div class="sp-row">
            <button id="btn-save-ha">保存</button>
            <button id="btn-test-ha">测试连接</button>
          </div>
          <div id="ha-result" class="dim"></div>
          <div class="sp-row">
            <button id="btn-ha-list">列设备（前100）</button>
          </div>
          <div id="ha-list" class="dim" style="max-height:180px;overflow:auto;white-space:pre-wrap"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 日记查看器形态（独立小窗，D2：内心独白按需查看） ============ -->
  <div id="diary-root" class="mode-diary">
    <header id="diary-titlebar">
      <div class="tb-title">凪的日记</div>
      <div class="tb-actions">
        <button id="btn-diary-refresh" title="刷新">↻</button>
        <button id="btn-diary-close" title="关闭">✕</button>
      </div>
    </header>
    <main id="diary-main">
      <div id="diary-empty" class="dim hidden">还没有日记。她独白的时候，会写下来。</div>
      <div id="diary-list"></div>
      <article id="diary-content"></article>
    </main>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
